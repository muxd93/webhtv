org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# java configuration
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk-amd64
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true

# ---------------------------------------------------------------------------
# webhtv 功能开关：关闭后对应重型资产 / 原生库不会打进 APK，代码保留，
# 运行期自动降级（缺失文件/库时走空值兜底，不会崩溃）。默认全部开启。
# 想要精简体积时，把对应项改为 false 再重新构建即可。
#   lut     -> 内置 LUT 调色预设（约 11MB），关闭后仅保留用户自定义 LUT
#   karaoke -> 卡拉OK Basic Pitch TFLite 人声提取（约 4MB 原生库 + 模型）
#   dovi    -> 杜比视界 DV5 GPU 渲染（约 10MB 原生库）
#   mitv    -> MiTV 解析通道（forcetech AAR 内 assets/libmitv.so，约 4MB）
#   thunder -> 迅雷/磁力/电驴下载解析（libxl_thunder_sdk.so + libxl_stat.so，约 6MB）
#   jianpian-> 简片/tvbox-xg/ftp 的 P2P 串流解析（libjpa.so，约 5MB）
#   mpv     -> MPV 播放内核（libmpv/libav* 整组 ffmpeg 共享库 + libplacebo，约 12MB）
#   ijk     -> IJK 播放内核（libijkffmpeg/libijkplayer/libijksdl，约 8MB）
#   exoass  -> ExoPlayer ASS/弹幕字幕渲染原生库（libexo_ass.so）
#   danmaku -> 弹幕系统（在线弹幕抓取/渲染，关闭后仍保留本地字幕）
#   webhome -> WebHome 网页主页（关闭后主页回退原生）。注意：媒体代理（局域网 /proxy，9978 端口）
#              由 Server 在开机时独立拉起，与 webhome 解耦；即便关闭 webhome，依赖本地代理的播放源仍可用。
#   newpipe -> NewPipe 解析通道（YouTube 等站点提取，关闭后走其他解析）
# 以上均为可选裁剪项，各自默认见下方开关值（并非全部开启）；引擎/通道关闭后播放器与解析自动降级。
# ---------------------------------------------------------------------------
webhtv.feature.lut=false
webhtv.feature.karaoke=false
webhtv.feature.dovi=false
webhtv.feature.mitv=false
webhtv.feature.thunder=true
webhtv.feature.jianpian=true
webhtv.feature.mpv=true
webhtv.feature.ijk=true
webhtv.feature.exoass=true
webhtv.feature.danmaku=false
webhtv.feature.webhome=false
webhtv.feature.newpipe=true
